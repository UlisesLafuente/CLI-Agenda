version: '3.8'

services:
  mysql-test:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: agenda_db
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    volumes:
      - mysql_test_data:/var/lib/mysql
      - ./src/test/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  mysql_test_data: